<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TaskForce AI — Admin sign in</title>
<style>
  :root {
    --bg-0: #08050f;
    --bg-1: #0d0a1a;
    --violet-light: #7858a6;
    --violet: #5b4b8a;
    --violet-deep: #371b58;
    --rose: #ff4d6d;
    --text-0: #f4f2fb;
    --text-1: #c9c3db;
    --text-2: #948eab;
    --text-3: #5f5878;
    --glass-bg: rgba(120, 88, 166, 0.06);
    --glass-border: rgba(187, 162, 219, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    font-family: 'Sora', system-ui, -apple-system, Segoe UI, sans-serif;
    color: var(--text-0);
    background: var(--bg-0);
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(1200px 800px at 12% -10%, rgba(91,75,138,0.28), transparent 60%),
      radial-gradient(1000px 700px at 95% 10%, rgba(120,88,166,0.18), transparent 60%),
      linear-gradient(180deg, #08050f 0%, #0d0a1a 50%, #08050f 100%);
  }
  .card {
    width: 100%; max-width: 420px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 36px 32px;
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6), 0 0 0 1px rgba(120,88,166,0.08), 0 40px 80px -40px rgba(91,75,138,0.4);
    position: relative;
    overflow: hidden;
    animation: card-in 320ms cubic-bezier(.2,.8,.2,1);
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--violet-deep), var(--violet-light), var(--violet-deep));
  }
  @keyframes card-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  h1 {
    margin: 0 0 4px;
    font-size: 24px;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff, #dcd3ee 60%, #948eab);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: 0 0 28px; color: var(--text-2); font-size: 13px; }
  label {
    display: block;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-2); margin-bottom: 6px; margin-top: 14px;
  }
  input {
    width: 100%; padding: 11px 13px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border);
    border-radius: 10px; color: var(--text-0);
    font-size: 14px; outline: none;
    transition: border-color 150ms, background 150ms, box-shadow 150ms;
  }
  input:hover { border-color: rgba(187,162,219,0.28); }
  input:focus {
    border-color: rgba(120,88,166,0.6);
    background: rgba(120,88,166,0.06);
    box-shadow: 0 0 0 3px rgba(91,75,138,0.25);
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 12px 16px;
    border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--violet-light), var(--violet) 55%, var(--violet-deep));
    color: #fff; font-weight: 600; font-size: 14px;
    cursor: pointer;
    box-shadow: 0 6px 24px -4px rgba(91,75,138,0.55);
    transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    position: relative;
    overflow: hidden;
  }
  button::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.18) 45%, transparent 60%);
    transform: translateX(-120%);
    transition: transform 520ms cubic-bezier(.2,.8,.2,1);
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 10px 30px -6px rgba(91,75,138,0.65);
  }
  button:hover:not(:disabled)::after { transform: translateX(120%); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .error {
    margin-top: 14px; padding: 10px 12px;
    background: rgba(255,77,109,0.08);
    border: 1px solid rgba(255,77,109,0.3);
    border-radius: 8px;
    color: #ffa9b9; font-size: 13px;
    display: none;
  }
  .error.show { display: block; }
  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 22px;
  }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: conic-gradient(from 210deg, var(--violet-light), var(--violet-deep), #bba2db, var(--violet-light));
    box-shadow: 0 0 18px rgba(91,75,138,0.4);
  }
  .brand-name {
    font-weight: 700; font-size: 16px; letter-spacing: -0.01em;
  }
  .brand-name span { color: var(--violet-light); }
  .footer { margin-top: 18px; text-align: center; font-size: 12px; color: var(--text-3); }
  .footer a { color: var(--text-2); transition: color 140ms ease; }
  .footer a:hover { color: var(--violet-light); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="/brand/taskforce-horizontal-white.svg" alt="TaskForce AI" style="height: 26px; width: auto;" />
      <div class="brand-name" style="font-weight: 500; color: var(--text-2);">· Admin</div>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Super admin console — operators only.</p>
    <form id="f" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />
      <div class="error" id="err"></div>
      <button id="btn" type="submit">Sign in</button>
    </form>
    <div class="footer">
      <a href="/portal/login">Client portal sign in →</a>
    </div>
  </div>
<script>
const form = document.getElementById('f');
const err = document.getElementById('err');
const btn = document.getElementById('btn');
form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/api/auth/admin/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({ message: 'Sign in failed' }));
      throw new Error(body.message || 'Sign in failed');
    }
    const next = new URLSearchParams(window.location.search).get('next') || '/admin/';
    window.location.href = next;
  } catch (e) {
    err.textContent = e.message;
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
